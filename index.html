<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Connexion – Campagne JDR</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body {
      margin:0; height:100vh; display:flex; justify-content:center; align-items:center;
      font-family: sans-serif; background:#0f1220; color:#e9ecff;
    }
    .box {
      background:#171b2d; padding:30px; border-radius:12px; text-align:center;
      box-shadow:0 0 20px rgba(0,0,0,.4);
    }
    h1 {margin-top:0;}
    button {
      padding:10px 16px; border:none; border-radius:8px;
      background:#7aa2ff; color:white; font-weight:bold; cursor:pointer;
    }
    button:hover {background:#5a82dd;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Campagne JDR</h1>
    <p>Connecte-toi ou crée un compte pour accéder au site</p>
    <button onclick="netlifyIdentity.open()">Connexion / Inscription</button>
  </div>

  <script>
    // Quand un utilisateur se connecte
    netlifyIdentity.on('login', user => {
      console.log('Connecté : ', user);
      window.location.href = "/personnages.html"; // après login, redirection vers la page du site
    });
  </script>
</body>
</html>
