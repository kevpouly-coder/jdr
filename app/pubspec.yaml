name: jdr_app
description: >-
  Application multiplateforme pour la gestion de fiches et de joueurs de jeu de rôle.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
  plugin:
    platforms:
      android:
        package: com.example.jdr_app
        pluginClass: JdrAppPlugin
      linux:
        pluginClass: JdrAppPlugin
      macos:
        pluginClass: JdrAppPlugin
      windows:
        pluginClass: JdrAppPlugin
