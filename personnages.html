<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campagne JDR – Personnages</title>
  <style>
    :root{ --bg:#0f1220; --panel:#171b2d; --text:#e9ecff; --muted:#9aa0c3; --accent:#7aa2ff; --line:#242a45; }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
    header{background:#11152a;padding:14px 20px;display:flex;gap:12px;align-items:center}
    a{color:var(--text);text-decoration:none}
    a:hover{color:var(--accent)}
    .wrap{max-width:1000px;margin:0 auto;padding:20px}
    h1{margin-top:0}
    .btn{display:inline-block;padding:10px 16px;background:#7aa2ff;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold}
    .btn:hover{background:#5a82dd}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
    .muted{color:var(--muted)}
    .right{margin-left:auto}
    button.logout{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer}
    button.logout:hover{color:var(--text);border-color:var(--accent)}
  </style>
</head>
<body>
  <header>
    <a href="/">← Retour</a>
    <span class="right"></span>
    <button class="logout" type="button" id="logout">Déconnexion</button>
    <a class="btn" href="/admin/index.html">➕ Ajouter un personnage</a>
  </header>

  <main class="wrap">
    <h1>Personnages</h1>
    <p class="muted">Chaque joueur peut créer sa fiche via le bouton ci‑dessus.</p>
    <div class="card">
      <p class="muted">Aucun personnage n’a encore été ajouté.</p>
      <p class="muted">Les fiches apparaîtront ici après leur création.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (async () => {
      if (!window.authHelpers) return;
      const session = await window.authHelpers.requireAuth({
        redirectTo: "/login.html",
        allowedRoles: ["joueur", "mj"]
      });

      if (!session) return;

      const logoutBtn = document.querySelector("#logout");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => window.authHelpers.signOut({ redirectTo: "/login.html" }));
      }
    })();
  </script>
</body>
</html>
