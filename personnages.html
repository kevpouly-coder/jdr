<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campagne JDR – Personnages</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root{ --bg:#0f1220; --panel:#171b2d; --text:#e9ecff; --muted:#9aa0c3; --accent:#7aa2ff; --line:#242a45; }
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
    header{background:#11152a;padding:14px 20px;display:flex;gap:12px;align-items:center}
    a{color:var(--text);text-decoration:none}
    a:hover{color:var(--accent)}
    .wrap{max-width:1000px;margin:0 auto;padding:20px}
    h1{margin-top:0}
    .btn{display:inline-block;padding:10px 16px;background:#7aa2ff;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold}
    .btn:hover{background:#5a82dd}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
    .muted{color:var(--muted)}
    .right{margin-left:auto}
  </style>
</head>
<body>
  <header>
    <a href="/">&larr; Déconnexion</a>
    <span class="right"></span>
    <a class="btn" href="/admin/#/collections/personnages/new">➕ Ajouter un personnage</a>
  </header>

  <main class="wrap">
    <h1>Personnages</h1>
    <p class="muted">Chaque joueur peut créer sa fiche via le bouton ci‑dessus.</p>
    <div class="card">
      <p class="muted">Aucun personnage n’a encore été ajouté.</p>
      <p class="muted">Les fiches apparaîtront ici après leur création.</p>
    </div>
  </main>

  <script>
    // Protection: si pas connecté, renvoyer à l'accueil
    netlifyIdentity.on('init', user => { if (!user) window.location.href = "/"; });
  </script>
</body>
</html>
