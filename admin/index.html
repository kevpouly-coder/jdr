<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Administration – Campagne JDR</title>
    <script>
      /* évite certains white screens rares */
      window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({
        config: {
          backend: { name: "git-gateway", branch: "main" }, // mets "master" si ta branche s’appelle master
          media_folder: "images/uploads",
          public_folder: "/images/uploads",
          collections: [
            {
              name: "personnages",
              label: "Personnages",
              folder: "personnage",
              create: true,
              slug: "{{slug}}",
              fields: [
                { label: "Nom du personnage", name: "title", widget: "string" },
                { label: "Joueur", name: "joueur", widget: "string" },
                { label: "Race", name: "race", widget: "string" },
                { label: "Classe", name: "classe", widget: "string" },
                { label: "Niveau", name: "niveau", widget: "number", min: 1, max: 20 },
                { label: "Notes / Histoire", name: "body", widget: "markdown" }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
