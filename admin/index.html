<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Administration – JDR</title>
    <script>window.process={env:{NODE_ENV:'production'}};</script>
    <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
      (async () => {
        if (!window.authHelpers) return;
        const session = await window.authHelpers.requireAuth({
          redirectTo: "/login.html",
          allowedRoles: ["mj"]
        });

        if (!session) return;

        CMS.init({
          config: {
            backend: { name: "git-gateway", branch: "main" },
            media_folder: "images/uploads",
            public_folder: "/images/uploads",
            collections: [
              {
                name: "personnages",
                label: "Personnages",
                folder: "personnage",
                create: true,
                slug: "{{slug}}",
                fields: [
                  { label: "Nom du personnage", name: "title", widget: "string" },
                  { label: "Joueur", name: "joueur", widget: "string" },
                  { label: "Race", name: "race", widget: "string" },
                  { label: "Classe", name: "classe", widget: "string" },
                  { label: "Niveau", name: "niveau", widget: "number", min: 1, max: 20 },
                  { label: "Notes / Histoire", name: "body", widget: "markdown" }
                ]
              }
            ]
          }
        });
      })();
    </script>
  </body>
</html>
