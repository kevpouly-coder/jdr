<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DnD – Personnages</title>
  <style>
    body{margin:0;background:#0f1220;color:#e9ecff;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:28px 18px}
    h1{margin:0 0 16px;font-size:clamp(26px,4vw,40px)}
    .muted{color:#9aa0c3}
    .topbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}
    .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid #242a45;background:#171b2d;color:#e9ecff;text-decoration:none}
    .btn:hover{border-color:#7aa2ff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:12px}
    .card{display:block;padding:16px;border:1px solid #242a45;border-radius:12px;background:#171b2d;color:#e9ecff;text-decoration:none}
    .card:hover{border-color:#7aa2ff}
    .empty{padding:16px;border:1px dashed #242a45;border-radius:12px;background:#14182a}
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="btn" href="dnd.html">← Retour au hub DnD</a>
      <h1 style="margin:0">Personnages</h1>
      <span style="flex:1"></span>
      <a class="btn" href="/admin/#/collections/personnages/new">➕ Ajouter un personnage</a>
    </div>
    <p class="muted">Chaque joueur crée sa fiche via le bouton ci-dessus. Les fiches apparaissent automatiquement ici.</p>

    <div id="list" class="grid"></div>
    <div id="empty" class="empty" style="display:none">Aucun personnage pour l’instant.</div>
  </main>

  <script>
    const GH_OWNER = "kevpouly-coder";
    const GH_REPO  = "jdr";
    const API_URL  = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/personnage`;

    function parseFrontMatter(md){
      const fm = { title:"(sans titre)", joueur:"", _raw:md };
      const m = md.match(/^---\\s*([\\s\\S]*?)\\s*---/);
      if(!m) return fm;
      m[1].split(/\\r?\\n/).forEach(line=>{
        const k = line.split(":")[0]?.trim();
        const v = line.split(":").slice(1).join(":").trim();
        if(k) fm[k] = v?.replace(/^\"|\"$/g,"");
      });
      return fm;
    }

    async function loadList(){
      try{
        const listEl = document.getElementById('list');
        const emptyEl = document.getElementById('empty');
        listEl.innerHTML = "";
        emptyEl.style.display = "none";

        const res = await fetch(API_URL);
        if(!res.ok){ throw new Error("Impossible de lister /personnage (repo privé ? dossier manquant ?)"); }
        const files = (await res.json()).filter(f=>f.name.endsWith(".md"));
        if(files.length === 0){ emptyEl.style.display = "block"; return; }

        for(const f of files){
          const raw = await fetch(f.download_url).then(r=>r.text());
          const fm  = parseFrontMatter(raw);
          const slug = f.name.replace(/\\.md$/,"");
          const title = fm.title || slug;

          const a = document.createElement('a');
          a.className = "card";
          a.href = `fiche.html?slug=${encodeURIComponent(slug)}`;
          a.innerHTML = `<strong>${title}</strong><br><span class="muted">${slug}</span>`;
          listEl.appendChild(a);
        }
      }catch(err){
        console.error(err);
        document.getElementById('empty').style.display = "block";
        document.getElementById('empty').textContent = "Erreur de chargement : " + err.message;
      }
    }
    loadList();
  </script>
</body>
</html>
